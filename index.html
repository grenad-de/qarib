<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QARIB - قريب</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Cairo,Inter,system-ui,sans-serif;background:#f3f4f6;color:#1f2937;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #3b82f6;outline-offset:1px}
.app{max-width:448px;height:100vh;height:100dvh;margin:0 auto;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.2)}
header{background:#1e3a8a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:.04em}
.dot{width:32px;height:32px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:18px}
.hbs{display:flex;gap:8px}
.hb{background:#1d4ed8;color:#fff;border:1px solid #60a5fa;border-radius:999px;padding:4px 10px;font-size:12px}
.demo{background:#fffbeb;color:#92400e;border-bottom:1px solid #fde68a;font-size:11px;padding:6px 12px}
main{flex:1;position:relative;overflow:hidden}
.view{display:none;position:absolute;inset:0;overflow:auto;padding:16px}
.view.on{display:block}
#v-map{padding:0}
#map{height:100%;width:100%;z-index:1;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:13px;text-align:center}
.ov{position:absolute;top:12px;left:12px;right:12px;z-index:800}
.sr{background:rgba(255,255,255,.93);border-radius:16px;padding:8px 12px;box-shadow:0 4px 12px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px}
.sr input{border:0;background:transparent;outline:0;flex:1;font:inherit;font-size:14px;margin:0;padding:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid #e5e7eb;background:rgba(255,255,255,.95);color:#374151;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.chip.on{background:#1e3a8a;border-color:#1e3a8a;color:#fff}
#picker{position:absolute;top:0;left:0;right:0;z-index:900;background:#1e3a8a;color:#fff;padding:10px 12px;font-size:12px}
#picker .r{display:flex;gap:8px;margin-top:8px}
h2{font-size:18px;margin:0 0 8px}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:10px;font:inherit;font-size:14px;background:#fff;color:inherit}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin-top:14px}
.chk input{width:20px;height:20px;padding:0;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700;width:100%}
.btn.sm{padding:6px 12px;font-size:12px;width:auto;border-radius:10px}
.btn.sec{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.btn.red{background:#dc2626}.btn.green{background:#16a34a}
.btn:disabled{opacity:.5}
.warn{font-size:11px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px;margin-bottom:8px}
.info{font-size:11px;color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px;margin-top:14px}
.box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:12px}
.box .r{display:flex;gap:8px;margin:6px 0}
.box .r .btn{font-size:12px;padding:8px}
.st{font-size:11px;color:#4b5563;text-align:center;margin:6px 0 0}
.err{color:#dc2626;font-size:12px;min-height:1.4em;margin:8px 0}
.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.card h3{margin:4px 0;font-size:14px;overflow-wrap:anywhere}
.card p{margin:2px 0;font-size:12px;color:#6b7280;overflow-wrap:anywhere}
.rt{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.pr{color:#1d4ed8;font-weight:800;font-size:14px}
.badge{display:inline-block;background:#eff6ff;color:#1d4ed8;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;margin-inline-end:4px}
.badge.demo{background:#fef3c7;color:#92400e}
.empty{text-align:center;font-size:12px;color:#6b7280;padding:24px 0}
#v-chat{padding:0}
#v-chat.on{display:flex;flex-direction:column;background:#f3f4f6}
.chead{background:#fff;padding:12px 16px;border-bottom:1px solid #e5e7eb}
.chead b{font-size:14px}.chead p{margin:2px 0 0;font-size:11px;color:#6b7280}
#msgs{flex:1;overflow:auto;padding:12px 16px}
.b{max-width:80%;padding:10px 12px;border-radius:16px;font-size:12px;margin-top:8px;box-shadow:0 1px 2px rgba(0,0,0,.08);background:#fff;overflow-wrap:anywhere}
.b.me{background:#2563eb;color:#fff;margin-inline-start:auto}
.cin{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #e5e7eb}
.cin input{flex:1;font-size:13px}.cin button{width:44px}
.pf{text-align:center;margin:12px 0}
.av{width:80px;height:80px;border-radius:50%;background:#1e3a8a;color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.rw{display:flex;justify-content:space-between;font-size:12px;padding:8px 0;border-bottom:1px solid #f0f0f0}
.rw:last-child{border:0}
nav{display:flex;justify-content:space-around;align-items:center;border-top:1px solid #e5e7eb;padding:8px 4px;background:#fff}
.nb{background:none;border:0;color:#9ca3af;display:flex;flex-direction:column;align-items:center;font-size:10px;gap:2px;padding:4px 8px}
.nb i{font-size:18px}.nb.on{color:#2563eb;font-weight:700}
.plus{background:#2563eb;color:#fff;border:0;width:48px;height:48px;border-radius:50%;margin-top:-20px;font-size:20px;box-shadow:0 4px 10px rgba(37,99,235,.4)}
.custom-pin{background:#1e3a8a;color:#fff;padding:4px 8px;border-radius:12px;font-weight:700;font-size:11px;box-shadow:0 4px 10px rgba(0,0,0,.25);border:2px solid #fff;white-space:nowrap;text-align:center}
.off{background:#fee2e2;color:#991b1b;font-size:12px;padding:6px 12px;text-align:center}.off.ok{background:#dcfce7;color:#166534}
.badge.urg{background:#fee2e2;color:#991b1b}
.urgpin{background:#dc2626}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.mb{background:#fff;border-radius:16px;padding:16px;width:100%}.r2{display:flex;gap:8px;margin-top:10px}
.lg{position:absolute;inset:0;background:#fff;z-index:3000;overflow:auto;display:flex;align-items:center;padding:20px}
.lg .mb{padding:0;width:100%}
.pop{min-width:150px}.pop p{font-size:12px;color:#4b5563;margin:4px 0 8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span class="dot">ق</span>QARIB</div>
    <div class="hbs">
      <button class="hb" id="lang-btn" type="button">Français</button>
      <button class="hb" id="gps-top" type="button"><i class="fa-solid fa-location-crosshairs"></i> <span data-i="gps_btn"></span></button>
    </div>
  </header>
  <div class="demo" data-i="banner"></div>
  <div class="off" id="off" role="status" hidden></div>

  <main>
    <section class="view on" id="v-map">
      <div id="map"></div>
      <div class="ov">
        <div class="sr"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="search" type="search" maxlength="60" data-p="search"></div>
        <div class="chips" id="chips">
          <button class="chip on" type="button" data-cat="all" data-i="cat_all"></button>
          <button class="chip" type="button" data-cat="moving" data-i="cat_moving"></button>
          <button class="chip" type="button" data-cat="repair" data-i="cat_repair"></button>
          <button class="chip" type="button" data-cat="delivery" data-i="cat_delivery"></button>
          <button class="chip" type="button" data-cat="tidy" data-i="cat_tidy"></button>
          <button class="chip" type="button" data-cat="other" data-i="cat_other"></button>
        </div>
      </div>
    </section>

    <section class="view" id="v-list">
      <h2 data-i="title_list"></h2>
      <p class="warn" data-i="list_note"></p>
      <div class="grid">
        <div><label for="s-sort" data-i="lbl_sort"></label><select id="s-sort"><option value="new" data-i="sort_new"></option><option value="price" data-i="sort_price"></option><option value="near" data-i="sort_near"></option></select></div>
        <div><label for="s-dist" data-i="lbl_dist"></label><select id="s-dist"><option value="0" data-i="dist_all"></option><option value="1" data-i="d1"></option><option value="2" data-i="d2"></option><option value="5" data-i="d5"></option><option value="10" data-i="d10"></option></select></div>
      </div>
      <p class="st" id="dist-note" style="text-align:start"></p>
      <label class="chk"><input id="s-closed" type="checkbox"><span data-i="show_closed"></span></label>
      <div id="list-box"></div>
    </section>

    <section class="view" id="v-create">
      <h2 data-i="title_create"></h2>
      <p class="warn" data-i="privacy"></p>
      <form id="form" novalidate>
        <label for="f-title" data-i="lbl_title"></label>
        <input id="f-title" type="text" maxlength="80" required data-p="ph_title">
        <label for="f-cat" data-i="lbl_cat"></label>
        <select id="f-cat"><option value="moving" data-i="cat_moving_f"></option><option value="repair" data-i="cat_repair_f"></option><option value="delivery" data-i="cat_delivery_f"></option><option value="tidy" data-i="cat_tidy_f"></option><option value="other" data-i="cat_other_f"></option></select>
        <div class="grid">
          <div><label for="f-price" data-i="lbl_price"></label><input id="f-price" type="number" min="0" max="1000000" inputmode="numeric" required placeholder="100"></div>
          <div><label for="f-time" data-i="lbl_time"></label><input id="f-time" type="text" maxlength="40" data-p="ph_time"></div>
        </div>
        <label for="f-urg" data-i="lbl_urg"></label>
        <select id="f-urg"><option value="flexible" data-i="urg_flexible"></option><option value="today" data-i="urg_today"></option><option value="urgent" data-i="urg_urgent"></option></select>
        <p class="st" data-i="price_note" style="text-align:start"></p>
        <label for="f-desc" data-i="lbl_desc"></label>
        <textarea id="f-desc" rows="3" maxlength="500" data-p="ph_desc"></textarea>
        <div class="box">
          <b style="font-size:12px" data-i="lbl_loc"></b>
          <div class="r">
            <button class="btn sec" type="button" id="b-gps"><i class="fa-solid fa-location-crosshairs"></i> <span data-i="btn_gps"></span></button>
            <button class="btn" type="button" id="b-pick"><i class="fa-solid fa-map-pin"></i> <span data-i="btn_pick"></span></button>
          </div>
          <select id="f-city" style="margin-top:8px"><option value="" data-i="city_ph"></option></select>
          <p class="st" id="loc-t" role="status"></p>
          <button class="btn sec sm" type="button" id="loc-undo" data-i="btn_undo" hidden style="margin-top:8px"></button>
        </div>
        <label class="chk"><input id="adult" type="checkbox"><span data-i="adult"></span></label>
        <p class="err" id="err" role="alert"></p>
        <button class="btn" type="submit" data-i="btn_submit"></button>
      </form>
    </section>

    <section class="view" id="v-chat">
      <div class="chead"><b data-i="chat_t"></b><p data-i="chat_s"></p><p id="about"></p><button class="btn sec sm" type="button" id="chat-rep" data-i="btn_report" style="margin-top:6px"></button></div>
      <div id="msgs"></div>
      <div class="cin"><input id="chat-in" type="text" maxlength="300" data-p="chat_ph"><button class="btn" type="button" id="send"><i class="fa-solid fa-paper-plane"></i></button></div>
    </section>

    <section class="view" id="v-profile">
      <div class="pf"><div class="av">؟</div><h2 style="margin-top:8px" data-i="prof_name"></h2><p class="badge demo" data-i="prof_unv"></p></div>
      <div class="box" style="margin-top:0">
        <div class="rw"><span data-i="prof_rating"></span><b data-i="prof_none"></b></div>
        <div class="rw"><span data-i="prof_phone"></span><b id="ph-v" dir="ltr"></b></div>
        <div class="rw"><span data-i="cnt"></span><b id="cnt-v">0</b></div>
        <div class="rw"><span data-i="stor"></span><b id="stor-v"></b></div>
      </div>
      <p class="info" data-i="prof_note"></p>
      <button class="btn sec" type="button" id="clear" style="margin-top:14px" data-i="btn_clear"></button>
      <button class="btn sec" type="button" id="logout" style="margin-top:8px" data-i="btn_logout"></button>
    </section>

    <div id="picker" hidden>
      <span id="pk-t"></span>
      <div class="r"><button class="btn green sm" type="button" id="pk-ok" data-i="btn_confirm"></button><button class="btn red sm" type="button" id="pk-no" data-i="btn_cancel"></button></div>
    </div>
  </main>

  <div class="lg" id="login">
    <div class="mb">
      <button class="btn sec sm" type="button" id="lg-lang">Français</button>
      <h2 style="margin-top:12px" data-i="login_t"></h2>
      <p class="st" id="lg-load" data-i="loading">جارٍ التحميل… | Chargement…</p>
      <div id="lg1" hidden>
        <p class="st" style="text-align:start" data-i="login_s"></p>
        <label for="lg-phone" data-i="lg_phone"></label>
        <input id="lg-phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="+212 6 12 34 56 78">
        <label class="chk"><input id="lg-adult" type="checkbox"><span data-i="adult"></span></label>
        <p class="warn" style="margin-top:12px" data-i="lg_privacy"></p>
        <button class="btn" type="button" id="lg-send" data-i="lg_send"></button>
      </div>
      <div id="lg2" hidden>
        <p class="st" style="text-align:start"><span data-i="lg_sent"></span> <bdi id="lg-shown" dir="ltr"></bdi></p>
        <label for="lg-code" data-i="lg_code"></label>
        <input id="lg-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" dir="ltr" placeholder="000000">
        <button class="btn" type="button" id="lg-verify" style="margin-top:12px" data-i="lg_verify"></button>
        <button class="btn sec" type="button" id="lg-back" style="margin-top:8px" data-i="lg_back"></button>
      </div>
      <p class="err" id="lg-err" role="alert"></p>
      <div id="rc"></div>
    </div>
  </div>

  <div id="modal" role="dialog" aria-modal="true" hidden>
    <div class="mb"><h2 data-i="report_t"></h2><p class="warn" data-i="report_note"></p>
      <select id="rp-reason"><option value="inappropriate" data-i="rs_inappropriate"></option><option value="scam" data-i="rs_scam"></option><option value="unsafe" data-i="rs_unsafe"></option><option value="other" data-i="rs_other"></option></select>
      <p class="st" id="rp-st" role="status"></p>
      <div class="r2"><button class="btn" type="button" id="rp-ok" data-i="btn_send"></button><button class="btn sec" type="button" id="rp-no" data-i="btn_cancel"></button></div>
    </div>
  </div>

  <nav>
    <button class="nb on" type="button" data-tab="map"><i class="fa-solid fa-map"></i><span data-i="nav_map"></span></button>
    <button class="nb" type="button" data-tab="list"><i class="fa-solid fa-list-ul"></i><span data-i="nav_list"></span></button>
    <button class="plus" type="button" data-tab="create" id="tab-create"><i class="fa-solid fa-plus"></i></button>
    <button class="nb" type="button" data-tab="chat"><i class="fa-solid fa-comments"></i><span data-i="nav_chat"></span></button>
    <button class="nb" type="button" data-tab="profile"><i class="fa-solid fa-user"></i><span data-i="nav_profile"></span></button>
  </nav>
</div>

<script>
window.addEventListener("error",function(e){var l=document.getElementById("lg-load");if(l){l.hidden=false;l.textContent="خطأ / Erreur: "+(e.message||"")}});
setTimeout(function(){if(!window.__qok){var l=document.getElementById("lg-load");if(l){l.hidden=false;l.textContent="تعذّر تشغيل التطبيق. حدّث الصفحة وتأكد من الاتصال بالإنترنت. | L’application n’a pas démarré. Actualisez la page et vérifiez la connexion."}}},8000);
</script>

  CITIES.forEach(function(c){var o=document.createElement("option");o.value=c.k;o.textContent=c[lang];sel.appendChild(o)});
  sel.value=loc&&loc.zone?loc.zone:"";
}
function render(){
  stat();
  var box=$("list-box"),a=list();box.textContent="";
  if(!a.length)box.appendChild(h("p","empty",tr("empty")));
  a.forEach(function(r){
    var c=h("div","card"),l=h("div");
    l.appendChild(h("span","badge",tr("cat_"+r.category)));
    if(r.demo)l.appendChild(h("span","badge demo",tr("demo_tag")));
    if(r.urgency)l.appendChild(h("span","badge"+(r.urgency==="urgent"?" urg":""),tr("urg_"+r.urgency)));
    var s0=state(r);if(s0!=="open")l.appendChild(h("span","badge demo",tr("st_"+s0)));
    l.appendChild(h("h3",null,r.title));
    l.appendChild(h("p",null,r.time||"—"));
    l.appendChild(h("p",null,tr("zone")+" "+zn(r.zone)+(r.km!=null?" - ~"+r.km.toFixed(1)+" "+tr("km"):"")));
    if(r.desc)l.appendChild(h("p",null,r.desc));
    c.appendChild(l);
    var rt=h("div","rt");rt.appendChild(h("span","pr",pt(r.price)));
    var b=h("button","btn sm",tr("accept"));b.type="button";b.onclick=function(){openChat(r.title)};rt.appendChild(b);
    var rp=h("button","btn sm sec",tr("btn_report"));rp.type="button";rp.onclick=function(){openReport(r.id)};rt.appendChild(rp);
    if(!r.demo){var sh=h("button","btn sm sec",tr("share"));sh.type="button";sh.onclick=function(){shareReq(r)};rt.appendChild(sh);var cp=h("button","btn sm sec",tr("copy"));cp.type="button";cp.onclick=function(){copyReq(r)};rt.appendChild(cp);if(mine(r)){var st=h("button","btn sm sec",tr(s0==="open"?"mark_done":"reopen"));st.type="button";st.onclick=function(){toggleDone(r.id)};rt.appendChild(st)}}
    if(mine(r)){var d=h("button","btn sm sec",tr("del"));d.type="button";d.onclick=function(){delReq(r.id)};rt.appendChild(d)}
    c.appendChild(rt);box.appendChild(c);
  });
  if(layer){
    layer.clearLayers();
    a.filter(function(r){return state(r)==="open"}).forEach(function(r){var u=r.urgency==="urgent";L.marker([r.lat,r.lng],{icon:L.divIcon({className:"custom-pin"+(u?" urgpin":""),html:(u?"⚡ ":"")+pt(r.price),iconSize:[u?74:60,25]})}).bindPopup(pop(r)).addTo(layer)});
  }
}

function initMap(){
  try{
    map=L.map("map",{zoomControl:false}).setView([30.35,-9.54],14);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
    layer=L.layerGroup().addTo(map);
    map.on("click",function(e){if(picking)setDraft(e.latlng.lat,e.latlng.lng)});
  }catch(e){map=null;layer=null;$("map").textContent=tr("nomap")}
}
function switchTab(n){
  if(n!=="map"&&picking)closePicker();
  ["map","list","create","chat","profile"].forEach(function(t){$("v-"+t).classList.toggle("on",t===n)});
  document.querySelectorAll("[data-tab]").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-tab")===n)});
  if(n==="map"&&map)setTimeout(function(){map.invalidateSize()},200);
}

/* Location picking: draft -> confirm / cancel, and a real undo afterwards */
function setDraft(lat,lng){
  if(!map)return;
  var la=snap(lat),ln=snap(lng);
  draft={lat:la,lng:ln};
  if(shape)map.removeLayer(shape);
  shape=L.circle([la,ln],{radius:600,color:"#2563eb",fillOpacity:.2}).addTo(map);
  $("pk-ok").disabled=false;$("pk-t").textContent=tr("pick_ready");
  setTimeout(function(){map.setView([la,ln],14)},250);
}
function openPicker(){
  picking=true;draft=null;
  if(shape&&map){map.removeLayer(shape);shape=null}
  $("pk-ok").disabled=true;$("pk-t").textContent=tr("pick_hint");$("picker").hidden=false;switchTab("map");
}
function closePicker(){
  picking=false;draft=null;$("picker").hidden=true;
  if(shape&&map){map.removeLayer(shape);shape=null}
}
function locUi(){
  $("loc-t").textContent=loc?(loc.zone?tr("loc_city"):tr("loc_ok")):tr("loc_none");
  $("loc-undo").hidden=!loc;$("f-city").value=loc&&loc.zone?loc.zone:"";
}
$("f-city").onchange=function(){
  var k=this.value,c=null;CITIES.forEach(function(x){if(x.k===k)c=x});
  if(picking)closePicker();
  loc=c?{lat:c.lat,lng:c.lng,zone:c.k}:null;locUi();
};
function getPos(ok){
  if(!navigator.geolocation){alert(tr("gps_none"));return}
  navigator.geolocation.getCurrentPosition(ok,function(){alert(tr("gps_fail"))},{enableHighAccuracy:true,timeout:15000});
}
$("b-pick").onclick=function(){if(!map){alert(tr("nomap"));return}openPicker()};
$("b-gps").onclick=function(){if(!map){alert(tr("nomap"));return}getPos(function(p){openPicker();setDraft(p.coords.latitude,p.coords.longitude)})};
$("pk-ok").onclick=function(){if(!draft)return;loc=draft;closePicker();locUi();switchTab("create")};
$("pk-no").onclick=function(){closePicker();locUi();switchTab("create")};
$("loc-undo").onclick=function(){loc=null;locUi()};
$("gps-top").onclick=function(){
  if(!map)return;
  getPos(function(p){
    var la=p.coords.latitude,ln=p.coords.longitude;
    map.setView([la,ln],15);
    if(me)map.removeLayer(me);
    me=L.circleMarker([la,ln],{radius:8,fillColor:"#2563eb",color:"#fff",weight:2,fillOpacity:1}).addTo(map).bindPopup(tr("you_here")).openPopup();
  });
};

$("form").onsubmit=function(e){
  e.preventDefault();
  var er=$("err"),title=$("f-title").value.trim(),price=Number($("f-price").value);
  er.textContent="";
  if(!title){er.textContent=tr("e_title");return}
  if($("f-price").value===""||!isFinite(price)||price<0||price>1000000){er.textContent=tr("e_price");return}
  if(!loc){er.textContent=tr("e_loc");return}
  if(!$("adult").checked){er.textContent=tr("e_adult");return}
  if(!uid)return;
  var cv=$("f-cat").value,btn=$("form").querySelector('button[type="submit"]');
  var data={ownerId:uid,title:title.slice(0,80),category:CATS.indexOf(cv)>-1?cv:"other",price:price,time:$("f-time").value.trim().slice(0,40),desc:$("f-desc").value.trim().slice(0,500),zone:loc.zone||"",lat:loc.lat,lng:loc.lng,urgency:UR.indexOf($("f-urg").value)>-1?$("f-urg").value:"flexible",done:false,ts:Date.now()};
  btn.disabled=true;
  addDoc(collection(db,"requests"),data).then(function(){$("form").reset();loc=null;locUi();switchTab("list")}).catch(function(){er.textContent=tr("e_save")}).then(function(){btn.disabled=false});
};

/* Chat: local simulation only */
function openChat(title){$("about").textContent=tr("chat_about")+" "+title;switchTab("chat")}
function sendMsg(){
  var i=$("chat-in"),t=i.value.trim();if(!t)return;
  var m=$("msgs");m.appendChild(h("div","b me",t));i.value="";m.scrollTop=m.scrollHeight;
  setTimeout(function(){m.appendChild(h("div","b",tr("chat_re")));m.scrollTop=m.scrollHeight},900);
}
$("send").onclick=sendMsg;
$("chat-in").onkeydown=function(e){if(e.key==="Enter")sendMsg()};

$("clear").onclick=function(){
  if(!confirm(tr("clear_q")))return;
  try{localStorage.removeItem(RK)}catch(e){}
  Promise.all(reqs.filter(mine).map(function(r){return deleteDoc(doc(db,"requests",r.id))})).catch(function(){alert(tr("e_save"))});
};
$("search").oninput=function(){q=this.value.trim().toLowerCase();render()};
document.querySelectorAll("[data-cat]").forEach(function(b){b.onclick=function(){
  cat=b.getAttribute("data-cat");
  document.querySelectorAll("[data-cat]").forEach(function(x){x.classList.toggle("on",x===b)});render();
}});
document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){switchTab(b.getAttribute("data-tab"))}});

/* Sorting / distance (user position stays in memory only, never saved) */
function needPos(done){
  if(!navigator.geolocation){alert(tr("gps_none"));done(false);return}
  navigator.geolocation.getCurrentPosition(function(p){userPos={lat:p.coords.latitude,lng:p.coords.longitude};done(true)},function(){alert(tr("gps_fail"));done(false)},{timeout:15000});
}
function distNote(){$("dist-note").textContent=(userPos&&(sortBy==="near"||maxKm>0))?tr("dist_note"):""}
function applyCtl(){
  var s=$("s-sort").value,d=+$("s-dist").value;
  function go(){sortBy=s;maxKm=d;distNote();render()}
  if((s==="near"||d>0)&&!userPos){needPos(function(ok){if(ok)go();else{$("s-sort").value=sortBy;$("s-dist").value=String(maxKm)}});return}
  go();
}
$("s-sort").onchange=applyCtl;$("s-dist").onchange=applyCtl;

/* Share: text summary only (requests are local, so there is no link to share yet) */
function shareReq(r){
  var t=tr("share_hdr")+": "+r.title+"\n"+tr("cat_"+r.category)+" - "+pt(r.price)+"\n"+tr("zone")+" "+zn(r.zone);
  if(navigator.share){navigator.share({title:"QARIB",text:t}).catch(function(){})}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert(tr("copied"))},function(){alert(tr("share_fail"))})}
  else alert(tr("share_fail"));
}

function copyReq(r){
  var t=tr("share_hdr")+": "+r.title+"\n"+tr("cat_"+r.category)+" - "+pt(r.price)+"\n"+tr("zone")+" "+zn(r.zone);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert(tr("copied"))},function(){alert(tr("share_fail"))})}
  else alert(tr("share_fail"));
}
/* Mark as helped / reactivate (an expired or finished request returns to the map with a fresh 48 h clock) */
function toggleDone(id){
  var x=null;reqs.forEach(function(r){if(r.id===id)x=r});
  if(!x||!mine(x))return;
  var patch=state(x)==="open"?{done:true}:{done:false,ts:Date.now()};
  updateDoc(doc(db,"requests",id),patch).catch(function(){alert(tr("e_save"))});
}
function delReq(id){deleteDoc(doc(db,"requests",id)).catch(function(){alert(tr("e_save"))})}
$("s-closed").onchange=function(){showClosed=this.checked;render()};

/* Report: saved locally only (no moderator receives it yet) */
function openReport(id){repKey=id;$("rp-st").textContent="";$("modal").hidden=false}
$("chat-rep").onclick=function(){openReport("chat")};
$("rp-no").onclick=function(){$("modal").hidden=true};
$("rp-ok").onclick=function(){
  var a=[];
  try{a=JSON.parse(localStorage.getItem(RK)||"[]");if(!Array.isArray(a))a=[]}catch(e){a=[]}
  a.unshift({ref:String(repKey),reason:$("rp-reason").value,ts:Date.now()});
  try{localStorage.setItem(RK,JSON.stringify(a.slice(0,50)))}catch(e){}
  $("rp-st").textContent=tr("report_done");
  setTimeout(function(){$("modal").hidden=true},1000);
};

/* Online / offline indicator (navigator.onLine only reflects the network link, not real Internet access) */
function net(){
  var o=$("off");
  if(navigator.onLine===false){clearTimeout(offT);o.hidden=false;o.className="off";o.textContent=tr("off_t")}
  else if(!o.hidden){o.className="off ok";o.textContent=tr("on_t");clearTimeout(offT);offT=setTimeout(function(){o.hidden=true},2500)}
}
window.addEventListener("offline",net);window.addEventListener("online",net);

/* ---- Accounts (phone) and shared requests (Firestore) ---- */
var uid=null,user=null,unsub=null,conf=null,verifier=null;
function mine(r){return !!uid&&r.ownerId===uid}
function maskPhone(p){return p.length>6?p.slice(0,3)+"•".repeat(p.length-5)+p.slice(-2):p}
function lgErr(k){$("lg-err").textContent=k?tr(k):""}
function subscribe(){
  if(unsub)unsub();
  unsub=onSnapshot(query(collection(db,"requests"),orderBy("ts","desc"),limit(200)),function(s){
    var a=[];s.forEach(function(d){var o=clean(Object.assign({},d.data(),{id:d.id}));if(o)a.push(o)});
    reqs=a;render();
  },function(){alert(tr("e_load"))});
}
$("lg-lang").onclick=function(){setLang(lang==="ar"?"fr":"ar")};
$("lg-send").onclick=function(){
  var p=$("lg-phone").value.replace(/[\s\-()]/g,""),b=$("lg-send");
  lgErr("");
  if(!/^\+\d{8,15}$/.test(p)){lgErr("lg_e_phone");return}
  if(!$("lg-adult").checked){lgErr("lg_e_adult");return}
  b.disabled=true;b.textContent=tr("sending");
  try{$("rc").textContent="";verifier=new RecaptchaVerifier(auth,"rc",{size:"invisible"})}catch(e){}
  signInWithPhoneNumber(auth,p,verifier)
    .then(function(c){conf=c;$("lg-shown").textContent=p;$("lg1").hidden=true;$("lg2").hidden=false})
    .catch(function(e){lgErr(e&&e.code==="auth/too-many-requests"?"lg_e_many":"lg_e_send");try{verifier.clear()}catch(x){}})
    .then(function(){b.disabled=false;b.textContent=tr("lg_send")});
};
$("lg-verify").onclick=function(){
  var c=$("lg-code").value.trim(),b=$("lg-verify");
  lgErr("");
  if(!/^\d{6}$/.test(c)){lgErr("lg_e_code");return}
  if(!conf)return;
  b.disabled=true;
  conf.confirm(c).catch(function(){lgErr("lg_e_wrong")}).then(function(){b.disabled=false});
};
$("lg-back").onclick=function(){$("lg2").hidden=true;$("lg1").hidden=false;$("lg-code").value="";lgErr("")};
$("logout").onclick=function(){signOut(auth)};
onAuthStateChanged(auth,function(u){
  user=u;uid=u?u.uid:null;$("lg-load").hidden=true;
  if(u){$("login").hidden=true;$("ph-v").textContent=maskPhone(u.phoneNumber||"");subscribe()}
  else{
    if(unsub){unsub();unsub=null}
    reqs=[];render();$("ph-v").textContent="";
    $("login").hidden=false;$("lg1").hidden=false;$("lg2").hidden=true;$("lg-code").value="";
  }
});

function setLang(l){
  lang=l;try{localStorage.setItem(LK,l)}catch(e){}
  document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(function(n){n.textContent=T[l][n.getAttribute("data-i")]});
  document.querySelectorAll("[data-p]").forEach(function(n){n.placeholder=T[l][n.getAttribute("data-p")]});
  $("lang-btn").textContent=l==="ar"?"Français":"العربية";$("lg-lang").textContent=l==="ar"?"Français":"العربية";
  $("send").setAttribute("aria-label",tr("send"));$("tab-create").setAttribute("aria-label",tr("title_create"));
  if(picking)$("pk-t").textContent=draft?tr("pick_ready"):tr("pick_hint");
  $("err").textContent="";cityOpts();locUi();render();net();distNote();
}
$("lang-btn").onclick=function(){setLang(lang==="ar"?"fr":"ar")};
initMap();
setLang(lang);
net();
window.__qok=true;
</script>
